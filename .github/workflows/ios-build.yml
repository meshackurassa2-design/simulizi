name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    # macos-14 has both Xcode 15 and 16 installed. We pin to Xcode 15.4
    # to avoid iOS 18.5 SDK which blocks unsigned device builds.
    runs-on: macos-14

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ── 2. Pin Xcode to 15.4 (latest on macos-13 runner) ─────────────────
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app
          xcodebuild -version

      # ── 3. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Capacitor ─────────────────────────────────────────────────────
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/ios@6

      # ── 5. Web assets ─────────────────────────────────────────────────────
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r css js assets index.html www/

      # ── 6. Init Capacitor & add iOS platform ──────────────────────────────
      - name: Initialize Capacitor & Add iOS
        run: |
          npx cap init "Simulizi" "com.meshackurassa2.simulizi" --web-dir www
          npx cap add ios

      # ── 7. Inject mandatory iOS privacy permission strings ────────────────
      - name: Inject Privacy Permissions into Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          inject() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          inject NSCameraUsageDescription      "Simulizi needs camera access to record videos."
          inject NSMicrophoneUsageDescription  "Simulizi needs microphone access to record audio."
          inject NSPhotoLibraryUsageDescription "Simulizi needs photo library access to upload videos."
          inject NSPhotoLibraryAddUsageDescription "Simulizi needs photo library access to save videos."

      # ── 8. App icons ──────────────────────────────────────────────────────
      - name: Generate App Icons
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --ios

      # ── 9. Pod install — disable signing for ALL pod targets via post_install
      - name: Install CocoaPods Dependencies (signing disabled)
        run: |
          cd ios/App
          cat >> Podfile << 'PODFILE_PATCH'

          post_install do |installer|
            installer.pods_project.targets.each do |t|
              t.build_configurations.each do |c|
                c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                c.build_settings['CODE_SIGNING_ALLOWED']  = 'NO'
                c.build_settings['CODE_SIGN_IDENTITY']    = ''
              end
            end
          end
          PODFILE_PATCH
          pod install

      # ── 10. Build (Xcode 15 + iOS 17 SDK — no signing needed) ────────────
      - name: Build iOS App Binary
        run: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --utf

      # ── 11. ldid fake-sign every binary (main binary + all frameworks) ────
      - name: Sign App Bundle with ldid
        run: |
          brew install ldid
          APP="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/App.app"

          echo "App bundle contents:"
          ls "$APP"

          # Sign all dylibs and framework binaries
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "Signing: $f"
              ldid -S "$f" || true
            fi
          done
          echo "✅ All Mach-O binaries signed with ldid"

      # ── 12. Package .ipa ──────────────────────────────────────────────────
      - name: Package into IPA
        run: |
          APP="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/App.app"
          mkdir -p "$GITHUB_WORKSPACE/ipa_out/Payload"
          cp -r "$APP" "$GITHUB_WORKSPACE/ipa_out/Payload/"
          cd "$GITHUB_WORKSPACE/ipa_out"
          zip -r Simulizi-v1.0.ipa Payload
          echo "✅ IPA size: $(du -sh Simulizi-v1.0.ipa)"

      # ── 13. Upload artifact ───────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Simulizi-iOS-IPA
          path: ${{ github.workspace }}/ipa_out/Simulizi-v1.0.ipa
          retention-days: 30
