name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/ios@6

      - name: Prepare Web Directory
        run: |
          mkdir www
          cp -r css js assets index.html www/ 2>/dev/null || true
          # Note: check-db.js and server.ps1 are not needed for the frontend app

      - name: Initialize Capacitor
        run: |
          npx cap init "Simulizi" "com.meshackurassa2.simulizi" --web-dir www
          npx cap add ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          # Disable code signing in the Podfile to prevent Pod signing errors
          sed -i '' "s/target.build_configurations.each do |config|/target.build_configurations.each do |config|\n      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'/g" Podfile
          pod install
          
          # Build for iOS device without code signing
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
            
          # Package unsigned IPA
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Simulizi-unsigned.ipa Payload
          
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Simulizi-iOS-Unsigned-IPA
          path: ios/App/Simulizi-unsigned.ipa
