name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/ios

      - name: Initialize Capacitor
        run: |
          npx cap init "Simulizi" "com.meshackurassa2.simulizi" --web-dir .
          npx cap add ios

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          # Build archive without code signing
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
            
          # Package unsigned IPA by zipping the .app
          mkdir -p Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Simulizi-unsigned.ipa Payload
          
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Simulizi-iOS-Unsigned-IPA
          path: ios/App/Simulizi-unsigned.ipa
