name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Install ldid early so it's available when we need it ──────────────
      - name: Install ldid
        run: brew install ldid

      # ── Web app setup ─────────────────────────────────────────────────────
      - name: Initialize npm & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/ios@6

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r css js assets index.html www/

      - name: Initialize Capacitor & Add iOS
        run: |
          npx cap init "Simulizi" "com.meshackurassa2.simulizi" --web-dir www
          npx cap add ios

      # ── Patch Info.plist — mandatory privacy keys ─────────────────────────
      - name: Inject Privacy Descriptions into Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Simulizi needs camera access to record videos.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Simulizi needs camera access to record videos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Simulizi needs microphone access to record audio.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Simulizi needs microphone access to record audio.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Simulizi needs photo library access to upload and save videos.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Simulizi needs photo library access to upload and save videos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Simulizi needs photo library access to save videos.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Simulizi needs photo library access to save videos.'" "$PLIST"

      # ── App icon generation ───────────────────────────────────────────────
      - name: Generate App Icons
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --ios

      # ── Pod install — code signing fully disabled here so pod compile works
      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          # Disable code signing for every pod target to avoid
          # "Ad Hoc not allowed with iOS 18.x SDK" build errors
          cat >> Podfile << 'RUBY'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED']  = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY']    = ''
              end
            end
          end
          RUBY
          pod install

      # ── xcodebuild — compile the app binary (no signing at all) ──────────
      - name: Build iOS App Binary
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --utf || true
          
          # Confirm the .app was produced
          ls "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/"

      # ── ldid fake-sign every binary inside the .app bundle ───────────────
      - name: Sign App Bundle with ldid
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          
          # Sign every executable/dylib/framework inside the bundle
          find "$APP" -type f \( -name "*.dylib" -o -name "*.framework" \) | while read f; do
            ldid -S "$f" 2>/dev/null || true
          done
          
          # Sign all files inside Frameworks/ subdirectory
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP/Frameworks"/*.framework; do
              bin="$fw/$(basename ${fw%.framework})"
              [ -f "$bin" ] && ldid -S "$bin"
            done
          fi
          
          # Sign the main app binary last
          ldid -S "$APP/App"
          echo "✅ ldid signing complete"

      # ── Package into .ipa ─────────────────────────────────────────────────
      - name: Package into IPA
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -r "$APP" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          zip -r Simulizi-v1.0.ipa Payload
          echo "✅ IPA created: $(du -sh Simulizi-v1.0.ipa)"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simulizi-iOS-IPA
          path: ${{ github.workspace }}/ipa/Simulizi-v1.0.ipa
          retention-days: 30
